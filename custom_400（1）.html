<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Bad Request</title>
    <style>
        body { 
            text-align: center; 
            padding: 100px 20px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f9f9f9;
            color: #333;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 72px; margin-bottom: 10px; color: #e74c3c; }
        h2 { font-size: 24px; margin-bottom: 20px; }
        p { font-size: 18px; line-height: 1.6; color: #666; }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>400</h1>
        <h2>Bad Request</h2>
        <p>Your browser sent a request that this server could not understand. This might be due to invalid syntax, an oversized header, or a corrupted cookie.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
