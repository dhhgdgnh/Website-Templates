<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>荷兰风车·幸运大转盘 | 风车奇缘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #9fd3e7 0%, #3b8c5a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', 'Quicksand', 'Microsoft YaHei', system-ui, sans-serif;
            overflow: hidden;
            padding: 20px;
        }

        /* 主卡片——荷兰风情玻璃质感 */
        .dutch-card {
            width: 1350px;
            max-width: 96%;
            background: rgba(245, 245, 220, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.3), inset 0 1px 3px rgba(255, 255, 200, 0.8);
            padding: 20px 28px 30px;
            border: 1px solid rgba(255, 245, 190, 0.7);
        }

        .main-dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            align-items: stretch;
        }

        /* 左侧风车造景区 + 转盘融合 */
        .windmill-landscape {
            flex: 1.5;
            min-width: 380px;
            background: rgba(120, 85, 45, 0.2);
            border-radius: 56px;
            backdrop-filter: blur(4px);
            padding: 18px 12px 25px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 200, 0.5), 0 12px 20px rgba(0,0,0,0.2);
        }

        /* 风车+转盘组合区 */
        .wheel-scene {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        /* 转盘外围（风车磨坊装饰） */
        .wheel-outer {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        /* 荷兰风车扇叶装饰（静态背景） */
        .windmill-sails {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: none;
        }
        .sail {
            position: absolute;
            background: rgba(90, 60, 30, 0.55);
            backdrop-filter: blur(2px);
            width: 12%;
            height: 48%;
            left: 44%;
            top: 2%;
            transform-origin: 50% 98%;
            border-radius: 30px 30px 12px 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #edd6a8;
        }
        .sail:nth-child(1) { transform: rotate(0deg); background: linear-gradient(120deg, #c9aa6f, #b87c3a); top: 2%; left: 44%; height: 48%;}
        .sail:nth-child(2) { transform: rotate(90deg); background: linear-gradient(120deg, #c9aa6f, #b87c3a);}
        .sail:nth-child(3) { transform: rotate(180deg); background: linear-gradient(120deg, #c9aa6f, #b87c3a);}
        .sail:nth-child(4) { transform: rotate(270deg); background: linear-gradient(120deg, #c9aa6f, #b87c3a);}
        
        /* 转盘本体的指针 */
        .pointer-golden {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 28px solid transparent;
            border-right: 28px solid transparent;
            border-top: 68px solid #f7c56e;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4));
            z-index: 35;
            transition: all 0.1s;
        }
        .pointer-golden::after {
            content: "🌷";
            position: absolute;
            top: -72px;
            left: -18px;
            font-size: 32px;
            color: #ff6b4a;
            text-shadow: 0 2px 8px gold;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 4s cubic-bezier(0.23, 0.94, 0.12, 1);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4), inset 0 0 0 8px #ffefb9, inset 0 0 0 12px #cfa668;
            background-color: #efe0c9;
            cursor: pointer;
            overflow: hidden;
            z-index: 20;
        }

        .segment-piece {
            position: absolute;
            width: 50%;
            height: 50%;
            left: 50%;
            top: 0;
            transform-origin: 0% 100%;
            overflow: hidden;
            transition: filter 0.2s;
            will-change: transform;
        }

        /* 圆盘内完全无字体，所有文字移除 */
        .label-sector {
            display: none;
        }

        /* 一等奖闪烁特效 */
        @keyframes grandWinGlow {
            0% { filter: brightness(1) drop-shadow(0 0 0 transparent); }
            50% { filter: brightness(1.5) drop-shadow(0 0 20px #ffcc66); }
            100% { filter: brightness(1) drop-shadow(0 0 0 transparent); }
        }
        .super-flash {
            animation: grandWinGlow 0.5s infinite alternate;
            z-index: 18;
            border-radius: 50%;
        }

        /* 风车基座 & 草地装饰 */
        .dutch-base {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 12px;
            align-items: baseline;
        }
        .wooden-shoe {
            width: 45px;
            height: 55px;
            background: radial-gradient(ellipse at 30% 30%, #cf9f4a, #9b6a2c);
            clip-path: polygon(20% 0%, 80% 0%, 95% 35%, 85% 100%, 15% 100%, 5% 35%);
            box-shadow: 0 6px 8px rgba(0,0,0,0.3);
            transform: rotate(5deg);
        }
        .tulip {
            font-size: 34px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
        }
        #spin-action-btn {
            background: linear-gradient(135deg, #ffbc6e, #e67e22);
            border: none;
            font-size: 1.45rem;
            font-weight: bold;
            padding: 12px 32px;
            margin-top: 12px;
            border-radius: 60px;
            color: #fff7e8;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 12px 18px rgba(0, 0, 0, 0.25);
            transition: 0.15s linear;
            width: 80%;
            max-width: 280px;
            font-family: inherit;
        }
        #spin-action-btn:active { transform: scale(0.96); }
        #spin-action-btn:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }

        /* 右侧面板：包含当前奖项 + 历史记录 */
        .info-panel {
            flex: 1;
            min-width: 280px;
            background: rgba(35, 45, 30, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 22px 20px;
            border: 1px solid rgba(255, 235, 160, 0.8);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* 当前奖项高亮区域 */
        .current-prize-section {
            background: rgba(255, 215, 140, 0.2);
            border-radius: 48px;
            padding: 18px 12px;
            margin-bottom: 28px;
            text-align: center;
            border: 1px solid #ffdd99;
            backdrop-filter: blur(4px);
        }
        .current-label {
            font-size: 1.2rem;
            color: #fff0c0;
            letter-spacing: 2px;
            font-weight: 500;
        }
        .current-prize-value {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE5A3, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            margin: 8px 0;
        }
        .prize-desc {
            font-size: 0.85rem;
            color: #fae67a;
        }

        .history-header {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffecb3;
            border-bottom: 2px solid #ffd966;
            display: inline-block;
            margin-bottom: 15px;
            letter-spacing: 2px;
            padding-bottom: 5px;
        }
        #history-records {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            max-height: 350px;
            padding-right: 5px;
        }
        .history-item {
            background: rgba(255, 245, 200, 0.2);
            margin-bottom: 12px;
            padding: 10px 18px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #fef0cf;
            border: 1px solid rgba(255, 210, 90, 0.5);
            transition: 0.2s;
        }
        .highlight-win {
            background: radial-gradient(circle, #ffd966, #f5bc42);
            color: #2c1b00;
            font-weight: 800;
            box-shadow: 0 0 12px #ffbf40;
        }

        /* 多语言配置栏 */
        .config-bar {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .config-group {
            background: rgba(50, 40, 25, 0.65);
            backdrop-filter: blur(6px);
            padding: 6px 18px;
            border-radius: 60px;
            display: flex;
            gap: 12px;
            align-items: center;
            color: #fff2cf;
            font-weight: 500;
        }
        .btn-icon {
            background: #f7d98c;
            border: none;
            padding: 5px 16px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: #2f2a1f;
        }
        .btn-icon.active {
            background: #ffbc3c;
            color: #23200c;
            box-shadow: 0 0 6px #ffdd88;
        }
        input[type="range"] {
            width: 140px;
            cursor: pointer;
            background: #ffdd99;
            height: 4px;
            border-radius: 10px;
        }
        .prize-count-num {
            min-width: 32px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 860px) {
            .current-prize-value { font-size: 1.6rem; }
            .wheel-scene { max-width: 360px; }
        }
    </style>
</head>
<body>
<div class="dutch-card">
    <div class="config-bar">
        <div class="config-group">
            <span>🌍</span>
            <button class="btn-icon" id="lang-en">EN</button>
            <button class="btn-icon" id="lang-zh">简</button>
            <button class="btn-icon" id="lang-zhhk">繁</button>
        </div>
        <div class="config-group">
            <span>🎡 奖项数</span>
            <input type="range" id="prizeSlider" min="2" max="10" step="1" value="8">
            <span id="prizeValueDisplay" class="prize-count-num">8</span>
        </div>
        <div class="config-group">
            <span>🔊 风铃</span>
            <button class="btn-icon" id="soundToggleBtn">ON</button>
        </div>
    </div>

    <div class="main-dashboard">
        <!-- 左侧荷兰风车+无字转盘造景 -->
        <div class="windmill-landscape">
            <div class="wheel-scene">
                <div class="wheel-outer">
                    <!-- 装饰性风车扇叶 -->
                    <div class="windmill-sails">
                        <div class="sail"></div>
                        <div class="sail"></div>
                        <div class="sail"></div>
                        <div class="sail"></div>
                    </div>
                    <div class="pointer-golden"></div>
                    <div id="wheel">
                        <div id="segmentsContainer"></div>
                        <div id="labelsContainer" class="label-sector"></div>
                    </div>
                </div>
            </div>
            <div class="dutch-base">
                <div class="wooden-shoe"></div>
                <div class="tulip">🌷🌻🌼</div>
                <div class="wooden-shoe" style="transform: scaleX(-1) rotate(5deg);"></div>
            </div>
            <button id="spin-action-btn">✨ 转起风车 ✨</button>
        </div>

        <!-- 右侧：当前奖项展示 + 历史记录 -->
        <div class="info-panel">
            <div class="current-prize-section" id="currentPrizeCard">
                <div class="current-label" id="currentLabelText">🏆 当前奖项</div>
                <div class="current-prize-value" id="currentPrizeDisplay">—等奖</div>
                <div class="prize-desc" id="prizeDescHint">✨ 好运正在旋转 ✨</div>
            </div>
            <div style="text-align:center;"><span class="history-header" id="historyTitle">📜 风车记录</span></div>
            <ul id="history-records">
                <li class="history-item" style="opacity:0.7;">🌀 转动风车 收获幸运 🌀</li>
            </ul>
        </div>
    </div>
</div>

<script>
    // ==================== 多语言资源 (圆盘内无文字但右侧当前奖项&历史需多语言) ====================
    const langMap = {
        en: {
            spinBtn: "✨ SPIN WINDMILL ✨",
            historyTitle: "📜 Windmill Records",
            currentTitle: "🏆 Current Prize",
            prizeDesc: "✨ Luck is spinning ✨",
            soundOn: "ON",
            soundOff: "OFF",
            awardSuffix: (num) => {
                if(num === 1) return "1st Prize";
                if(num === 2) return "2nd Prize";
                if(num === 3) return "3rd Prize";
                return `${num}th Prize`;
            }
        },
        'zh-Hans': {
            spinBtn: "✨ 转动风车 ✨",
            historyTitle: "📜 风车记录",
            currentTitle: "🏆 当前奖项",
            prizeDesc: "✨ 好运正在旋转 ✨",
            soundOn: "开启",
            soundOff: "关闭",
            awardSuffix: (num) => `${num}等奖`
        },
        'zh-Hant': {
            spinBtn: "✨ 轉動風車 ✨",
            historyTitle: "📜 風車記錄",
            currentTitle: "🏆 當前獎項",
            prizeDesc: "✨ 好運正在旋轉 ✨",
            soundOn: "開啟",
            soundOff: "關閉",
            awardSuffix: (num) => `${num}等獎`
        }
    };

    let currentLang = 'zh-Hans';
    let prizeCount = 8;
    let soundEnabled = true;
    let spinning = false;
    let currentRotation = 0;
    
    // 历史数据存储（奖项索引）
    let historyData = [];     
    
    // DOM 元素
    const segmentsContainer = document.getElementById('segmentsContainer');
    const spinBtn = document.getElementById('spin-action-btn');
    const prizeSlider = document.getElementById('prizeSlider');
    const prizeValueDisplay = document.getElementById('prizeValueDisplay');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const historyListEl = document.getElementById('history-records');
    const historyTitleEl = document.getElementById('historyTitle');
    const currentPrizeDisplay = document.getElementById('currentPrizeDisplay');
    const currentLabelText = document.getElementById('currentLabelText');
    const prizeDescHint = document.getElementById('prizeDescHint');

    // 荷兰风车配色 (更具草原风情)
    const colorPalette = ["#F2CF66", "#9DC3C2", "#E7B874", "#B5C48A", "#F4A261", "#A7C5BD", "#E9AFA3", "#C5E0B4", "#FAD4A5", "#B0C4B1", "#EECF9D", "#D4B895"];
    
    // 声音引擎 (风铃音效)
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx && soundEnabled) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) { console.warn("Audio not supported"); }
        }
    }
    function playTriumphSound() {
        if (!soundEnabled) return;
        try {
            initAudio();
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const notes = [587.33, 783.99, 987.77, 1174.66];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.12, now + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.12);
                osc.stop(now + i * 0.12 + 0.5);
            });
        } catch(e) {}
    }
    
    function playDoubleSound() {
        if (!soundEnabled) return;
        try {
            initAudio();
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = 523.25;
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        } catch(e) {}
    }
    
    // 获取奖项文本 (用于右侧当前奖项和历史)
    function getPrizeText(index) {
        const prizeNumber = index + 1;
        return langMap[currentLang].awardSuffix(prizeNumber);
    }
    
    // 更新右侧当前奖项显示
    function updateCurrentPrizeDisplay(prizeIndex) {
        const prizeName = getPrizeText(prizeIndex);
        currentPrizeDisplay.innerText = prizeName;
        if (prizeIndex === 0) {
            currentPrizeDisplay.style.textShadow = "0 0 8px gold";
            prizeDescHint.innerText = langMap[currentLang].prizeDesc.replace('✨', '🌟 头奖！🌟');
        } else {
            currentPrizeDisplay.style.textShadow = "0 2px 4px rgba(0,0,0,0.2)";
            prizeDescHint.innerText = langMap[currentLang].prizeDesc;
        }
    }
    
    // 构建转盘扇形 (圆盘内无任何文字)
    function buildWheel() {
        segmentsContainer.innerHTML = '';
        if (prizeCount < 2) return;
        const angleStep = 360 / prizeCount;
        const skewAngle = 90 - angleStep;
        
        for (let i = 0; i < prizeCount; i++) {
            const seg = document.createElement('div');
            seg.className = 'segment-piece';
            const bgColor = colorPalette[i % colorPalette.length];
            seg.style.backgroundColor = bgColor;
            
            if (prizeCount === 2) {
                seg.style.width = "100%";
                seg.style.height = "50%";
                seg.style.left = "0";
                seg.style.top = i === 0 ? "0" : "50%";
                seg.style.transformOrigin = "50% 50%";
                seg.style.transform = `rotate(0deg)`;
                seg.style.clipPath = i === 0 ? "inset(0 0 50% 0)" : "inset(50% 0 0 0)";
            } 
            else if (prizeCount === 3) {
                seg.style.width = "100%";
                seg.style.height = "100%";
                seg.style.left = "0";
                seg.style.top = "0";
                seg.style.transformOrigin = "50% 50%";
                const startAng = i * 120;
                const radMid = (startAng + 60) * Math.PI / 180;
                const x1 = 50 + 50 * Math.cos(radMid);
                const y1 = 50 + 50 * Math.sin(radMid);
                const radNext = (startAng + 180) * Math.PI / 180;
                const x2 = 50 + 50 * Math.cos(radNext);
                const y2 = 50 + 50 * Math.sin(radNext);
                seg.style.clipPath = `polygon(50% 50%, ${x1}% ${y1}%, ${x2}% ${y2}%)`;
                seg.style.transform = `rotate(${startAng}deg)`;
            }
            else {
                seg.style.transform = `rotate(${i * angleStep}deg) skewY(-${skewAngle}deg)`;
                seg.style.width = "50%";
                seg.style.height = "50%";
                seg.style.left = "50%";
                seg.style.top = "0";
                seg.style.transformOrigin = "0% 100%";
            }
            seg.setAttribute('data-seg-id', i);
            segmentsContainer.appendChild(seg);
        }
        // 确保没有文字容器残留
        const labelsDiv = document.getElementById('labelsContainer');
        if(labelsDiv) labelsDiv.innerHTML = '';
    }
    
    // 刷新界面文本 (右侧以及按钮历史)
    function refreshUItexts() {
        spinBtn.innerText = langMap[currentLang].spinBtn;
        historyTitleEl.innerText = langMap[currentLang].historyTitle;
        currentLabelText.innerText = langMap[currentLang].currentTitle;
        prizeDescHint.innerText = langMap[currentLang].prizeDesc;
        soundToggleBtn.innerText = soundEnabled ? langMap[currentLang].soundOn : langMap[currentLang].soundOff;
        prizeValueDisplay.innerText = prizeCount;
        // 重新刷新历史记录 & 当前奖项显示（如果存在最后一抽或默认）
        renderHistoryList();
        if (historyData.length > 0) {
            const lastWin = historyData[0].prizeIndex;
            updateCurrentPrizeDisplay(lastWin);
        } else {
            updateCurrentPrizeDisplay(0);
        }
    }
    
    // 渲染历史记录 (多语言)
    function renderHistoryList() {
        if (!historyListEl) return;
        historyListEl.innerHTML = '';
        if (historyData.length === 0) {
            const emptyLi = document.createElement('li');
            emptyLi.className = 'history-item';
            emptyLi.innerText = currentLang === 'en' ? '🌀 Spin the windmill 🌀' : '🌀 转动风车 收获幸运 🌀';
            historyListEl.appendChild(emptyLi);
            return;
        }
        [...historyData].reverse().forEach(item => {
            const li = document.createElement('li');
            li.className = 'history-item';
            if (item.isWinFirst) li.classList.add('highlight-win');
            let awardName = getPrizeText(item.prizeIndex);
            li.innerHTML = `<strong>🎁 ${awardName}</strong><span>${item.timestamp}</span>`;
            historyListEl.appendChild(li);
        });
    }
    
    // 添加历史记录并更新当前奖项
    function addHistoryRecord(prizeIndex) {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
        const isFirst = (prizeIndex === 0);
        historyData.unshift({ prizeIndex, isWinFirst: isFirst, timestamp: timeStr });
        if (historyData.length > 18) historyData.pop();
        renderHistoryList();
        updateCurrentPrizeDisplay(prizeIndex);
    }
    
    // 一等奖闪烁特效 (仅转盘)
    function flashFirstPrize() {
        const segs = document.querySelectorAll('.segment-piece');
        segs.forEach(s => s.classList.remove('super-flash'));
        if (segs.length > 0) {
            segs[0].classList.add('super-flash');
            setTimeout(() => {
                if(segs[0]) segs[0].classList.remove('super-flash');
            }, 2200);
        }
    }
    
    // 旋转抽奖核心
    async function spinWheel() {
        if (spinning) return;
        spinning = true;
        spinBtn.disabled = true;
        document.querySelectorAll('.segment-piece').forEach(s => s.classList.remove('super-flash'));
        
        const randomSpins = 360 * (Math.floor(Math.random() * 7) + 6);
        const extra = Math.random() * 360;
        const delta = randomSpins + extra;
        currentRotation += delta;
        const wheelEl = document.getElementById('wheel');
        wheelEl.style.transform = `rotate(${currentRotation}deg)`;
        
        await new Promise(resolve => setTimeout(resolve, 4000));
        
        const finalAngle = currentRotation % 360;
        const angleStep = 360 / prizeCount;
        let effective = (360 - finalAngle) % 360;
        let prizeIndex = Math.floor(effective / angleStep);
        if (prizeIndex >= prizeCount) prizeIndex = prizeCount - 1;
        if (prizeIndex < 0) prizeIndex = 0;
        
        if (prizeIndex === 0) {
            playTriumphSound();
            flashFirstPrize();
        } else {
            playDoubleSound();
        }
        
        addHistoryRecord(prizeIndex);
        spinBtn.disabled = false;
        spinning = false;
        
        if (prizeIndex === 0) {
            const highlight = document.querySelector('.history-item.highlight-win');
            if (highlight) highlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
    
    // 奖项数量变动
    function onPrizeCountChange() {
        let newVal = parseInt(prizeSlider.value, 10);
        prizeCount = newVal;
        prizeValueDisplay.innerText = prizeCount;
        buildWheel();
        document.getElementById('wheel').style.transform = `rotate(${currentRotation % 360}deg)`;
        document.querySelectorAll('.segment-piece').forEach(s => s.classList.remove('super-flash'));
        // 刷新右侧默认显示第一个奖项文本
        if(historyData.length === 0) updateCurrentPrizeDisplay(0);
        else updateCurrentPrizeDisplay(historyData[0].prizeIndex);
    }
    
    function setLanguage(langKey) {
        if (langKey === 'zh-Hans') currentLang = 'zh-Hans';
        else if (langKey === 'zh-Hant') currentLang = 'zh-Hant';
        else currentLang = 'en';
        refreshUItexts();
        document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
        document.getElementById('lang-zh').classList.toggle('active', currentLang === 'zh-Hans');
        document.getElementById('lang-zhhk').classList.toggle('active', currentLang === 'zh-Hant');
    }
    
    function toggleSound() {
        soundEnabled = !soundEnabled;
        soundToggleBtn.innerText = soundEnabled ? langMap[currentLang].soundOn : langMap[currentLang].soundOff;
        soundToggleBtn.classList.toggle('active', soundEnabled);
        if (soundEnabled && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    // 绑定事件
    spinBtn.addEventListener('click', spinWheel);
    prizeSlider.addEventListener('input', (e) => {
        prizeCount = parseInt(e.target.value, 10);
        prizeValueDisplay.innerText = prizeCount;
        buildWheel();
        document.getElementById('wheel').style.transform = `rotate(${currentRotation % 360}deg)`;
        if(historyData.length === 0) updateCurrentPrizeDisplay(0);
        else updateCurrentPrizeDisplay(historyData[0].prizeIndex);
    });
    soundToggleBtn.addEventListener('click', toggleSound);
    document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
    document.getElementById('lang-zh').addEventListener('click', () => setLanguage('zh-Hans'));
    document.getElementById('lang-zhhk').addEventListener('click', () => setLanguage('zh-Hant'));
    
    // 初始化
    function init() {
        prizeCount = 8;
        prizeSlider.value = 8;
        prizeValueDisplay.innerText = 8;
        buildWheel();
        refreshUItexts();
        currentRotation = 0;
        document.getElementById('wheel').style.transform = `rotate(0deg)`;
        historyData = [];
        renderHistoryList();
        updateCurrentPrizeDisplay(0);
        spinBtn.disabled = false;
        document.body.addEventListener('click', () => {
            if (soundEnabled && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });
    }
    init();
</script>
</body>
</html>
